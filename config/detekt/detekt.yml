# Sakuro detekt config — on top of the defaults (buildUponDefaultConfig = true).
# Only deviations from the default: relaxations for Compose and taste-based rules
# that we do not treat as errors in this project.

build:
  maxIssues: 0

complexity:
  LongMethod:
    ignoreAnnotated: ['Composable'] # a screen is one big composable, splitting it is artificial
  LongParameterList:
    ignoreAnnotated: ['Composable'] # composables take parameters instead of DI — that is normal
    constructorThreshold: 9 # DI components (Decompose) receive dependencies via the constructor
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable'] # composable functions are PascalCase
    # default excludes + desktopTest: our jvm target is named desktop,
    # and backtick test names are legal there too
    excludes:
      [
        '**/test/**',
        '**/androidTest/**',
        '**/androidUnitTest/**',
        '**/androidInstrumentedTest/**',
        '**/commonTest/**',
        '**/jvmTest/**',
        '**/desktopTest/**',
        '**/jsTest/**',
        '**/iosTest/**',
      ]
  MatchingDeclarationName:
    active: false # we name a file by meaning (its main composable/function), not by a single class

style:
  MagicNumber:
    active: false # thresholds/coefficients in detection and gestures read better inline
  ReturnCount:
    active: false
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']

formatting:
  android: true
  Filename:
    active: false # files with several declarations are named by meaning
  FunctionName:
    active: false # duplicates naming.FunctionNaming, but without ignoreAnnotated
  ArgumentListWrapping:
    active: false
  ParameterListWrapping:
    active: false
  MaximumLineLength:
    maxLineLength: 120
