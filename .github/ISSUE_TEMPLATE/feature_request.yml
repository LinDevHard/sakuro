name: Feature request
description: Suggest a focused product, engine, UI, or tooling improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or workflow does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Sakuro do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any simpler option, workaround, or comparable app behavior?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Android app
        - Player UI
        - Media3 engine
        - mpv engine
        - Upscale presets
        - Content detection
        - Benchmark tooling
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional Context
      description: Screenshots, examples, links, constraints, or compatibility notes.
