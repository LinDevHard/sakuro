name: Bug report
description: Report a reproducible app, playback, UI, or build bug.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail to reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Playback stops when switching from Media3 to mpv on a local HEVC file.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Tap ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options:
        - Media3
        - mpv
        - Fake/Desktop
        - Not sure
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device And OS
      placeholder: Pixel 9a, Android 16 / API 36
    validations:
      required: false
  - type: input
    id: media
    attributes:
      label: Media Details
      placeholder: H.264, 854x480, MKV, 24 fps, local file
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs, Screenshots, Or Recordings
      description: Attach logs or screenshots if they help. Remove private file names or paths if needed.
    validations:
      required: false
  - type: input
    id: commit
    attributes:
      label: Commit Or Version
      placeholder: main @ abc1234 / v0.1.0
    validations:
      required: false
