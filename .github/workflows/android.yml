name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Verify and build F-Droid flavor
        run: bundle exec fastlane android ci

      - name: Upload unsigned F-Droid APK
        uses: actions/upload-artifact@v7
        with:
          name: sakuro-fdroid-unsigned
          path: composeApp/build/outputs/apk/foss/release/composeApp-foss-release-unsigned.apk
          if-no-files-found: error

      - name: Upload dependency license report
        uses: actions/upload-artifact@v7
        with:
          name: sakuro-release-licenses
          path: build/reports/licenses/foss-release.tsv
          if-no-files-found: error

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Materialize upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKURO_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sakuro-upload.jks"

      - name: Build release bundle
        env:
          SAKURO_UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/sakuro-upload.jks
          SAKURO_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SAKURO_UPLOAD_KEYSTORE_PASSWORD }}
          SAKURO_UPLOAD_KEY_ALIAS: ${{ secrets.SAKURO_UPLOAD_KEY_ALIAS }}
          SAKURO_UPLOAD_KEY_PASSWORD: ${{ secrets.SAKURO_UPLOAD_KEY_PASSWORD }}
          SAKURO_ENABLE_R8: ${{ vars.SAKURO_ENABLE_R8 || 'false' }}
        run: bundle exec fastlane android release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sakuro-${{ github.ref_name }}
          path: dist/${{ github.ref_name }}/
          if-no-files-found: error
          retention-days: 30
