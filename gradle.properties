org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g

# Release identity. versionCode must increase for every published build.
sakuro.versionName=0.1.0
sakuro.versionCode=1

# Keep disabled until device benchmark/parity validation is complete. Release
# automation can override this with -Psakuro.enableR8=true.
sakuro.enableR8=false
